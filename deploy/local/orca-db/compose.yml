services:
  orca-db:
    image: mariadb:11
    container_name: orca-db
    ports:
      - "${ORCA_LOCAL_DB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: "${ORCA_LOCAL_DB_NAME:-orca}"
      MARIADB_USER: "${ORCA_LOCAL_DB_USERNAME:?ORCA_LOCAL_DB_USERNAME is required}"
      MARIADB_PASSWORD: "${ORCA_LOCAL_DB_PASSWORD:?ORCA_LOCAL_DB_PASSWORD is required}"
      MARIADB_ROOT_PASSWORD: "${ORCA_LOCAL_DB_ROOT_PASSWORD:?ORCA_LOCAL_DB_ROOT_PASSWORD is required}"
    volumes:
      - orca-db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  orca-db-data:
